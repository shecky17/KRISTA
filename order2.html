<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            background: #ffffff;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #e68a00;
        }
        
        /* Gaya Tampilan Sukses (Order Diterima) */
        .success-box {
            display: none;
            text-align: center;
        }
        .success-icon {
            font-size: 50px;
            color: #4caf50;
            margin-bottom: 15px;
        }
        .success-title {
            color: #333;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .success-subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .order-summary {
            background-color: #f9f9f9;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }
        .summary-item {
            margin-bottom: 10px;
            font-size: 14px;
            color: #444;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #eee;
            padding-bottom: 5px;
        }
        .summary-item strong {
            color: #111;
        }
        .total-item {
            margin-top: 15px;
            font-size: 18px;
            color: #ff9800;
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #ff9800;
            padding-top: 10px;
        }
        .total-item strong {
            color: #ff9800;
            font-size: 20px;
        }
        
        /* Tombol Hijau WhatsApp */
        .btn-wa-confirm {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.3s;
        }
        .btn-wa-confirm:hover {
            background-color: #128C7E;
        }
        
        .btn-repeat {
            display: inline-block;
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-container">
    <!-- BLOK 1: HALAMAN FORM UTAMA -->
    <div id="formSection">
        <h2>Form Pemesanan Produk</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" required placeholder="Masukkan nama Anda">
            </div>

            <div class="form-group">
                <label for="produk">Pilih Produk:</label>
                <select id="produk" required>
                    <option value="">-- Pilih Produk --</option>
                    <option value="50000">Baju Kaos Polos - Rp 50.000</option>
                    <option value="150000">Jaket Hoodie - Rp 150.000</option>
                    <option value="35000">Topi Snapback - Rp 35.000</option>
                </select>
            </div>

            <div class="form-group">
                <label for="jumlah">Jumlah Order:</label>
                <input type="number" id="jumlah" min="1" value="1" required>
            </div>

            <div class="form-group">
                <label for="ongkir">Metode Pengiriman (Ongkir):</label>
                <select id="ongkir" required>
                    <option value="">-- Pilih Kurir --</option>
                    <option value="9000">J&T Reguler - Rp 9.000</option>
                    <option value="11000">JNE Reguler - Rp 11.000</option>
                    <option value="15000">SiCepat Best - Rp 15.000</option>
                    <option value="0">Ambil Sendiri di Toko - Gratis</option>
                </select>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Pengiriman:</label>
                <textarea id="alamat" rows="3" required placeholder="Tulis alamat lengkap Anda"></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Order</button>
        </form>
    </div>

    <!-- BLOK 2: HALAMAN SUKSES (ORDER DITERIMA) -->
    <div id="successSection" class="success-box">
        <div class="success-icon">✅</div>
        <div class="success-title">Order diterima!</div>
        <div class="success-subtitle">Terima kasih, pesanan Anda sudah kami catat.</div>
        
        <div class="order-summary">
            <div class="summary-item"><span>Nama:</span> <strong id="resNama">-</strong></div>
            <div class="summary-item"><span>Produk:</span> <strong id="resProduk">-</strong></div>
            <div class="summary-item"><span>Jumlah:</span> <strong id="resJumlah">-</strong></div>
            <div class="summary-item"><span>Kurir:</span> <strong id="resKurir">-</strong></div>
            <div class="summary-item"><span>Alamat:</span> <strong id="resAlamat">-</strong></div>
            <div class="total-item"><span>Total Bayar:</span> <strong id="resTotal">Rp 0</strong></div>
        </div>

        <!-- Tombol Kirim Chat ke WhatsApp -->
        <a href="#" id="waConfirmBtn" target="_blank" class="btn-wa-confirm">Konfirmasi via WhatsApp</a>

        <br>
        <a class="btn-repeat" onclick="resetForm()">Buat order lagi</a>
    </div>
</div>

<script>
document.getElementById('orderForm').addEventListener('submit', function(event) {
    event.preventDefault();

    // Nomor WhatsApp tujuan Anda
    const nomorWA = "6285876712482"; 

    // Mengambil nilai teks input biasa
    const nama = document.getElementById("nama").value.trim();
    const alamat = document.getElementById("alamat").value.trim();
    const jumlah = parseInt(document.getElementById("jumlah").value);

    // Memproses Informasi Produk (Mengambil Teks Pilihan)
    const produkSelect = document.getElementById("produk");
    const hargaProduk = parseInt(produkSelect.value);
    const namaProduk = produkSelect.options[produkSelect.selectedIndex].text; 

    // Memproses Informasi Kurir (Mengambil Teks Pilihan)
    const ongkirSelect = document.getElementById("ongkir");
    const biayaOngkir = parseInt(ongkirSelect.value);
    const namaKurir = ongkirSelect.options[ongkirSelect.selectedIndex].text; 

    // Perhitungan Total Harga
    const totalHargaAkhir = (hargaProduk * jumlah) + biayaOngkir;

    // Membuat Format Rupiah
    const formatRupiah = new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
    }).format(totalHargaAkhir);

    // Mengisi data ke halaman ringkasan sukses
    document.getElementById("resNama").innerText = nama;
    document.getElementById("resProduk").innerText = namaProduk;
    document.getElementById("resJumlah").innerText = jumlah + " pcs";
    document.getElementById("resKurir").innerText = namaKurir;
    document.getElementById("resAlamat").innerText = alamat;
    document.getElementById("resTotal").innerText = formatRupiah;

    // Menyusun teks template untuk chat WhatsApp pembeli
    const teksPesan = "Halo Admin, saya telah melakukan pemesanan via Web:\n\n" +
                      "*Nama:* " + nama + "\n" +
                      "*Produk:* " + namaProduk + "\n" +
                      "*Jumlah:* " + jumlah + " pcs\n" +
                      "*Pengiriman:* " + namaKurir + "\n" +
                      "*Alamat:* " + alamat + "\n\n" +
                      "*TOTAL BAYAR:* " + formatRupiah;

    // Menyusun link tautan wa.me resmi
    const urlWhatsApp = "https://wa.me/" + nomorWA + "?text=" + encodeURIComponent(teksPesan);

    // Memasukkan link WhatsApp ke tombol hijau
    document.getElementById("waConfirmBtn").setAttribute("href", urlWhatsApp);

    // Membuka Halaman Sukses
    document.getElementById("formSection").style.display = "none";
    document.getElementById("successSection").style.display = "block";
});

function resetForm() {
    document.getElementById("orderForm").reset();
    document.getElementById("successSection").style.display = "none";
    document.getElementById("formSection").style.display = "block";
}
</script>

</body>
</html>
