<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            background: #ffffff;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-submit:hover:not(:disabled) {
            background-color: #e68a00;
        }
        
        .success-box {
            display: none;
            text-align: center;
        }
        .success-icon {
            font-size: 50px;
            color: #4caf50;
            margin-bottom: 15px;
        }
        .success-title {
            color: #333;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .success-subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .order-summary {
            background-color: #f9f9f9;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }
        .summary-item {
            margin-bottom: 10px;
            font-size: 14px;
            color: #444;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #eee;
            padding-bottom: 5px;
        }
        .summary-item strong {
            color: #111;
        }
        .total-item {
            margin-top: 15px;
            font-size: 18px;
            color: #ff9800;
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #ff9800;
            padding-top: 10px;
        }
        .total-item strong {
            color: #ff9800;
            font-size: 20px;
        }
        
        .btn-wa-confirm {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.3s;
        }
        .btn-wa-confirm:hover {
            background-color: #128C7E;
        }
        
        .btn-repeat {
            display: inline-block;
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div id="formSection">
        <h2>Form Pemesanan Produk</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required placeholder="Masukkan nama Anda">
            </div>

            <div class="form-group">
                <label for="produk">Pilih Produk:</label>
                <select id="produk" name="produk" required>
                    <option value="">-- Pilih Produk --</option>
                    <option value="50000">Baju Kaos Polos - Rp 50.000</option>
                    <option value="150000">Jaket Hoodie - Rp 150.000</option>
                    <option value="35000">Topi Snapback - Rp 35.000</option>
                </select>
            </div>

            <div class="form-group">
                <label for="jumlah">Jumlah Order:</label>
                <input type="number" id="jumlah" name="jumlah" min="1" value="1" required>
            </div>

            <div class="form-group">
                <label for="ongkir">Metode Pengiriman (Ongkir):</label>
                <select id="ongkir" name="kurir" required>
                    <option value="">-- Pilih Kurir --</option>
                    <option value="9000">J&T Reguler - Rp 9.000</option>
                    <option value="11000">JNE Reguler - Rp 11.000</option>
                    <option value="15000">SiCepat Best - Rp 15.000</option>
                    <option value="0">Ambil Sendiri di Toko - Gratis</option>
                </select>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Pengiriman:</label>
                <textarea id="alamat" name="alamat" rows="3" required placeholder="Tulis alamat lengkap Anda"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Kirim Order</button>
        </form>
    </div>

    <div id="successSection" class="success-box">
        <div class="success-icon">✅</div>
        <div class="success-title">Order diterima!</div>
        <div class="success-subtitle">Terima kasih, pesanan Anda sudah kami catat otomatis di pembukuan toko.</div>
        
        <div class="order-summary">
            <div class="summary-item"><span>Nama:</span> <strong id="resNama">-</strong></div>
            <div class="summary-item"><span>Produk:</span> <strong id="resProduk">-</strong></div>
            <div class="summary-item"><span>Jumlah:</span> <strong id="resJumlah">-</strong></div>
            <div class="summary-item"><span>Kurir:</span> <strong id="resKurir">-</strong></div>
            <div class="summary-item"><span>Alamat:</span> <strong id="resAlamat">-</strong></div>
            <div class="total-item"><span>Total Bayar:</span> <strong id="resTotal">Rp 0</strong></div>
        </div>

        <a href="#" id="waConfirmBtn" target="_blank" class="btn-wa-confirm">Konfirmasi via WhatsApp</a>
        <br>
        <a class="btn-repeat" onclick="resetForm()">Buat order lagi</a>
    </div>
</div>

<script>
document.getElementById('orderForm').addEventListener('submit', function(event) {
    event.preventDefault();

    // Mengunci tombol agar tidak diklik dua kali saat proses kirim data ke Google Sheets
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.innerText = "Memproses Order...";
    submitBtn.disabled = true;

    const nomorWA = "6285876712482"; 

    const nama = document.getElementById("nama").value.trim();
    const alamat = document.getElementById("alamat").value.trim();
    const jumlah = parseInt(document.getElementById("jumlah").value);

    const produkSelect = document.getElementById("produk");
    const hargaProduk = parseInt(produkSelect.value);
    const namaProduk = produkSelect.options[produkSelect.selectedIndex].text; 

    const ongkirSelect = document.getElementById("ongkir");
    const biayaOngkir = parseInt(ongkirSelect.value);
    const namaKurir = ongkirSelect.options[ongkirSelect.selectedIndex].text; 

    const totalHargaAkhir = (hargaProduk * jumlah) + biayaOngkir;

    const formatRupiah = new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
    }).format(totalHargaAkhir);

    // Jalur Pengiriman Data Otomatis ke Google Sheets via Fetch API
    // ⚠️ MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzgpw_zidBdAgnqJmFl980hKzvjjUVCeKT7EFzVKn5UDDxQtX8T6hmeF4gbzWm0pm8v/exec';
    
    // Menyusun paket data khusus untuk Google Sheets
    const formData = new FormData();
    formData.append('nama', nama);
    formData.append('produk', namaProduk);
    formData.append('jumlah', jumlah + " pcs");
    formData.append('kurir', namaKurir);
    formData.append('alamat', alamat);
    formData.append('total', formatRupiah);

    // Mengirimkan data ke Google Sheets di latar belakang
    fetch(scriptURL, { method: 'POST', body: formData})
    .then(response => {
        // Teks Sukses Web
        document.getElementById("resNama").innerText = nama;
        document.getElementById("resProduk").innerText = namaProduk;
        document.getElementById("resJumlah").innerText = jumlah + " pcs";
        document.getElementById("resKurir").innerText = namaKurir;
        document.getElementById("resAlamat").innerText = alamat;
        document.getElementById("resTotal").innerText = formatRupiah;

        // Teks Pesan WhatsApp
        const teksPesan = "Halo Admin, saya telah melakukan pemesanan via Web:\n\n" +
                          "*Nama:* " + nama + "\n" +
                          "*Produk:* " + namaProduk + "\n" +
                          "*Jumlah:* " + jumlah + " pcs\n" +
                          "*Pengiriman:* " + namaKurir + "\n" +
                          "*Alamat:* " + alamat + "\n\n" +
                          "*TOTAL BAYAR:* " + formatRupiah;

const urlWhatsApp = "wa.me/" + nomorWA + "?text=" + encodeURIComponent(teksPesan);
        document.getElementById("waConfirmBtn").setAttribute("href", urlWhatsApp);
        
// Ubah Tampilan ke Halaman Sukses
        document.getElementById("formSection").style.display = "none";
        document.getElementById("successSection").style.display = "block";
    })
        .catch(error => {alert("Waduh, terjadi kendala koneksi saat menyimpan order. Silakan coba klik Kirim lagi!");
                         submitBtn.innerText = "Kirim Order";
                         submitBtn.disabled = false;
                         console.error('Error!', error.message);
                        });
});
        
function resetForm() {
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.innerText = "Kirim Order";
    submitBtn.disabled = false;
    document.getElementById("orderForm").reset();
    document.getElementById("successSection").style.display = "none";
    document.getElementById("formSection").style.display = "block";}

          </script>

</body>
</html>
