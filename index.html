<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .split-container {
            display: flex;
            max-width: 1000px;
            background: #ffffff;
            margin: 40px auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .photo-column {
            flex: 1;
            background-color: #fdfdfd;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #eaeaea;
        }
        .main-img {
            width: 100%;
            max-width: 400px;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .form-column {
            flex: 1;
            padding: 30px;
        }
        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-submit:hover:not(:disabled) {
            background-color: #e68a00;
        }
        .success-box {
            display: none;
            text-align: center;
        }
        .success-icon {
            font-size: 50px;
            color: #4caf50;
            margin-bottom: 15px;
        }
        .success-title {
            color: #333;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .success-subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .order-summary {
            background-color: #f9f9f9;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }
        .summary-item {
            margin-bottom: 10px;
            font-size: 14px;
            color: #444;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #eee;
            padding-bottom: 5px;
        }
        .summary-item strong {
            color: #111;
        }
        .total-item {
            margin-top: 15px;
            font-size: 18px;
            color: #ff9800;
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #ff9800;
            padding-top: 10px;
        }
        .total-item strong {
            color: #ff9800;
            font-size: 20px;
        }
        .btn-wa-confirm {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.3s;
        }
        .btn-wa-confirm:hover {
            background-color: #128C7E;
        }
        .btn-repeat {
            display: inline-block;
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
                margin: 10px auto;
            }
            .photo-column {
                border-right: none;
                border-bottom: 1px solid #eaeaea;
                padding: 20px;
            }
            .main-img {
                height: 250px;
            }
            .form-column {
                padding: 20px;
            }
        }
        .slideshow-container {
  position: relative;
  width: 100%;
  max-width: 450px; /* Sesuaikan dengan ukuran area foto Anda */
  height: 400px;    /* Sesuaikan tinggi yang Anda inginkan */
  overflow: hidden;
  border-radius: 15px; /* Opsional: membuat sudut foto melengkung */
}

.slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 1.5s ease-in-out; /* Kecepatan transisi perpindahan foto */
}

/* --- KODE TAMBAHAN UNTUK MERAPIKAN THUMBNAIL (TARUH DI BARIS 203) --- */
.thumbnail-row {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    justify-content: center;
    width: 100%;       /* Memaksa area kotak kecil melebar horizontal di bawah */
    clear: both;       /* Mencegah elemen meluber menyamping */
    z-index: 5;
}

.thumb-img {
    width: 60px !important;   /* Memaksa ukuran kotak kecil tetap 60px */
    height: 60px !important;  /* Memaksa tinggi tetap 60px */
    object-fit: cover;        /* Menjaga foto tidak penyok/gepeng */
    border-radius: 8px;       /* Membuat sudut melengkung halus */
    cursor: pointer;
    opacity: 0.5;             /* Membuat transparan samar saat tidak aktif */
    transition: all 0.3s ease;
}

.thumb-img.active {
    border: 2px solid #ff9800; /* Memberi garis tepi jingga menyala */
    opacity: 1;                /* Menjadikan gambar terang solid saat aktif */
}

        
        /* Ketika slide aktif, foto akan muncul perlahan dan animasi jalan */
.slide.active {
  opacity: 1;
}

.slide.active img {
  animation: slowZoomOut 6s linear forwards; /* Durasi animasi tiap foto (6 detik) */
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.2); /* Memulai foto dari kondisi agak besar */
}

/* Animasi menggerakkan skala foto mengecil (Zoom Out) */
@keyframes slowZoomOut {
  from {
    transform: scale(1.2);
  }
  to {
    transform: scale(1.0);
  }
}

/* Kontainer pembungkus titik-titik */
.dot-container {
    position: absolute;
    bottom: 20px; /* Jarak dari bawah foto utama */
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px; /* Jarak antar titik */
    z-index: 10; /* Memastikan titik berada di atas gambar */
}

/* Bentuk dasar titik */
.dot {
    cursor: pointer;
    height: 10px;
    width: 10px;
    background-color: rgba(255, 255, 255, 0.5); /* Putih transparan saat tidak aktif */
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.3s ease, transform 0.3s ease;
}

/* Tampilan titik dan thumbnail saat sedang aktif terpilih */
.dot.active {
    background-color: #ffffff; /* Putih terang benderang */
    transform: scale(1.2);     /* Sedikit lebih besar agar menonjol */
    width: 24px;               /* Membuat bentuk agak lonjong seperti di web contoh */
    border-radius: 5px;
}

    </style>
    
</head>
<body>

<div class="split-container">
    
    <!-- KOLOM KIRI: SLIDESHOW PRODUK -->
<div class="slideshow-container">
    <!-- AREA SLIDE FOTO UTAMA -->
    <div class="slide active">
        <img src="dimsum1.jpg" alt="Foto 1">
    </div>
    <div class="slide">
        <img src="dimsum2.png" alt="Foto 2">
    </div>

    <!-- TANDA TITIK INDIKATOR (Melayang di atas foto utama) -->
    <div class="dot-container" id="dynamic-dots"></div>
</div> <!-- ⚠️ TAG PENUTUP SLIDESHOW-CONTAINER HARUS DI SINI -->

<!-- AREA THUMBNAIL (Wajib berada di LUAR container agar tercetak di bawah foto) -->
<div class="thumbnail-row" id="dynamic-thumbs"></div>


      <!-- KOLOM KANAN: FORM ORDER / RINGKASAN SUKSES -->
    <div class="form-column">
        
        <!-- BLOK FORM UTAMA -->
        <div id="formSection">
            <h2>Form Pemesanan Produk</h2>
            <!-- Perbaikan Utama: Mengubah button tipe menjadi button biasa untuk menghindari auto-reload -->
            <form id="orderForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" required placeholder="Masukkan nama Anda">
                </div>

                <div class="form-group">
                    <label for="produk">Pilih Produk:</label>
                    <select id="produk" required>
                        <option value="">-- Pilih Produk --</option>
                        <option value="50000">Baju Kaos Polos - Rp 50.000</option>
                        <option value="150000">Jaket Hoodie - Rp 150.000</option>
                        <option value="35000">Topi Snapback - Rp 35.000</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jumlah">Jumlah Order:</label>
                    <input type="number" id="jumlah" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="ongkir">Metode Pengiriman (Ongkir):</label>
                    <select id="ongkir" required>
                        <option value="">-- Pilih Kurir --</option>
                        <option value="9000">J&T Reguler - Rp 9.000</option>
                        <option value="11000">JNE Reguler - Rp 11.000</option>
                        <option value="15000">SiCepat Best - Rp 15.000</option>
                        <option value="0">Ambil Sendiri di Toko - Gratis</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat Pengiriman:</label>
                    <textarea id="alamat" rows="3" required placeholder="Tulis alamat lengkap Anda"></textarea>
                </div>

                <!-- Menggunakan tipe button murni agar aman dari pemaksaan reload oleh browser -->
                <button type="button" id="submitBtn" onclick="prosesValidasiDanKirim()" class="btn-submit">Kirim Order</button>
            </form>
        </div>

        <!-- BLOK HALAMAN SUKSES (ORDER DITERIMA) -->
        <div id="successSection" class="success-box">
            <div class="success-icon">✅</div>
            <div class="success-title">Order diterima!</div>
            <div class="success-subtitle">Terima kasih, pesanan Anda sudah tercatat otomatis di pembukuan toko.</div>
            
            <div class="order-summary">
                <div class="summary-item"><span>Nama:</span> <strong id="resNama">-</strong></div>
                <div class="summary-item"><span>Produk:</span> <strong id="resProduk">-</strong></div>
                <div class="summary-item"><span>Jumlah:</span> <strong id="resJumlah">-</strong></div>
                <div class="summary-item"><span>Kurir:</span> <strong id="resKurir">-</strong></div>
                <div class="summary-item"><span>Alamat:</span> <strong id="resAlamat">-</strong></div>
                <div class="total-item"><span>Total Bayar:</span> <strong id="resTotal">Rp 0</strong></div>
            </div>

            <a href="#" id="waConfirmBtn" target="_blank" class="btn-wa-confirm">Konfirmasi via WhatsApp</a>
            <br>
            <a class="btn-repeat" onclick="resetForm()">Buat order lagi</a>
        </div>

    </div>
</div>

<script>
    // Membungkus seluruh fungsi agar script HANYA berjalan saat semua HTML selesai dimuat browser
    window.addEventListener('DOMContentLoaded', () => {
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dotContainer = document.getElementById('dynamic-dots');
        const thumbContainer = document.getElementById('dynamic-thumbs');
        const slideInterval = 5000; // Foto berganti otomatis tiap 5 detik
        let autoSlideTimer;

        // Validasi pengaman jika elemen tidak ditemukan di halaman
        if (slides.length === 0 || !dotContainer || !thumbContainer) return;

        // Kosongkan wadah terlebih dahulu untuk mencegah duplikasi/cache berulang
        dotContainer.innerHTML = "";
        thumbContainer.innerHTML = "";

        // 1. GENERATE TITIK & THUMBNAIL OTOMATIS BERDASARKAN JUMLAH FOTO DI HTML
        slides.forEach((slide, index) => {
            const imgInside = slide.querySelector('img');
            if (!imgInside) return;
            const srcGambar = imgInside.getAttribute('src');

            // Membuat elemen Titik (Dot)
            const dot = document.createElement('span');
            dot.className = index === 0 ? 'dot active' : 'dot';
            dot.addEventListener('click', () => gantiFotoManual(index));
            dotContainer.appendChild(dot);

            // Membuat elemen Gambar Kecil (Thumbnail)
            const thumb = document.createElement('img');
            thumb.src = srcGambar;
            thumb.className = index === 0 ? 'thumb-img active' : 'thumb-img';
            thumb.addEventListener('click', () => gantiFotoManual(index));
            thumbContainer.appendChild(thumb);
        });

        // 2. LOGIKA UTAMA PERPINDAHAN FOTO
        function tampilkanSlide(n) {
            const dots = document.querySelectorAll('.dot');
            const thumbs = document.querySelectorAll('.thumb-img');

            // Sembunyikan semua elemen aktif terlebih dahulu
            slides.forEach(slide => slide.classList.remove('active'));
            if(dots.length) dots.forEach(dot => dot.classList.remove('active'));
            if(thumbs.length) thumbs.forEach(thumb => thumb.classList.remove('active'));

            // Mengatur putaran urutan indeks agar kembali ke awal jika sudah foto terakhir
            currentSlide = (n + slides.length) % slides.length;

            // Aktifkan elemen foto, titik, dan thumbnail sesuai urutan baru
            slides[currentSlide].classList.add('active');
            if (dots[currentSlide]) dots[currentSlide].classList.add('active');
            if (thumbs[currentSlide]) thumbs[currentSlide].classList.add('active');
        }

        function nextSlide() {
            tampilkanSlide(currentSlide + 1);
        }

        window.gantiFotoManual = function(n) {
            tampilkanSlide(n);
            resetTimer();
        }

        function resetTimer() {
            clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(nextSlide, slideInterval);
        }

        // Mulai jalankan hitungan otomatis pertama kali
        resetTimer();
    });
</script>

</body>
</html>
