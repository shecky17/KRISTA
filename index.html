<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            background: #ffffff;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-wa {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            cursor: pointer;
        }
        .btn-wa:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Form Pemesanan Produk</h2>
    <form id="orderForm">
        <div class="form-group">
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" required placeholder="Masukkan nama Anda">
        </div>

        <div class="form-group">
            <label for="produk">Pilih Produk:</label>
            <select id="produk" required>
                <option value="">-- Pilih Produk --</option>
                <option value="Baju Kaos Polos">Baju Kaos Polos - Rp 50.000</option>
                <option value="Jaket Hoodie">Jaket Hoodie - Rp 150.000</option>
                <option value="Topi Snapback">Topi Snapback - Rp 35.000</option>
            </select>
        </div>

        <div class="form-group">
            <label for="jumlah">Jumlah Order:</label>
            <input type="number" id="jumlah" min="1" value="1" required>
        </div>

        <div class="form-group">
            <label for="alamat">Alamat Pengiriman:</label>
            <textarea id="alamat" rows="3" required placeholder="Tulis alamat lengkap Anda"></textarea>
        </div>

        <!-- Tombol diganti menjadi tag link HTML langsung agar 100% stabil -->
        <a href="#" id="tombolKirim" class="btn-wa" onclick="prosesPesan(event)">Kirim via WhatsApp</a>
    </form>
</div>

<script>
function prosesPesan(event) {
    // Mencegah link kosong berjalan sebelum data diproses
    event.preventDefault();

    // Nomor WhatsApp Anda (Sudah dimasukkan otomatis dengan benar)
    const nomorWA = "6285876712482"; 

    // Mengambil data dari input form
    const nama = document.getElementById("nama").value.trim();
    const produk = document.getElementById("produk").value;
    const jumlah = document.getElementById("jumlah").value;
    const alamat = document.getElementById("alamat").value.trim();

    // Validasi input agar tidak kosong
    if (nama === "" || produk === "" || jumlah === "" || alamat === "") {
        alert("Mohon lengkapi semua data pemesanan terlebih dahulu!");
        return;
    }

    // Menyusun teks pesan WhatsApp dengan format rapi
    const teksPesan = "Halo Admin, saya ingin memesan produk:\n\n" +
                      "*Nama:* " + nama + "\n" +
                      "*Produk:* " + produk + "\n" +
                      "*Jumlah:* " + jumlah + " pcs\n" +
                      "*Alamat:* " + alamat;

    // Membuat URL WhatsApp yang valid menggunakan fungsi bawaan browser (encodeURIComponent)
    const urlLengkap = "https://whatsapp.com" + nomorWA + "&text=" + encodeURIComponent(teksPesan);

    // Mengalihkan halaman ke aplikasi WhatsApp
    window.location.href = urlLengkap;
}
</script>

</body>
</html>
