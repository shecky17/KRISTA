<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .split-container {
            display: flex;
            max-width: 1000px;
            background: #ffffff;
            margin: 40px auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .photo-column {
            flex: 1;
            background-color: #fdfdfd;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #eaeaea;
        }
        .main-img {
            width: 100%;
            max-width: 400px;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .form-column {
            flex: 1;
            padding: 30px;
        }
        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-submit:hover:not(:disabled) {
            background-color: #e68a00;
        }
        .success-box {
            display: none;
            text-align: center;
        }
        .success-icon {
            font-size: 50px;
            color: #4caf50;
            margin-bottom: 15px;
        }
        .success-title {
            color: #333;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .success-subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .order-summary {
            background-color: #f9f9f9;
            border: 1px solid #eaeaea;
            border-radius: 8px;

            padding-bottom: 5px;
        }
        .summary-item strong {
            color: #111;
        }
        .total-item {
            margin-top: 15px;
            font-size: 18px;
            color: #ff9800;
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #ff9800;
            padding-top: 10px;
        }
        .total-item strong {
            color: #ff9800;
            font-size: 20px;
        }
        .btn-wa-confirm {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.3s;
        }
        .btn-wa-confirm:hover {
            background-color: #128C7E;
        }
        .btn-repeat {
            display: inline-block;
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
                margin: 10px auto;
            }

                border-right: none;
                border-bottom: 1px solid #eaeaea;
                padding: 20px;
            }
            .main-img {
                height: 250px;
            }
            .form-column {
                padding: 20px;
            }
        }
        .slideshow-container {
  position: relative;
  width: 100%;
  max-width: 450px; /* Sesuaikan dengan ukuran area foto Anda */
  height: 400px;    /* Sesuaikan tinggi yang Anda inginkan */
  overflow: hidden;
  border-radius: 15px; /* Opsional: membuat sudut foto melengkung */
}

.slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 1.5s ease-in-out; /* Kecepatan transisi perpindahan foto */
}

/* Ketika slide aktif, foto akan muncul perlahan dan animasi jalan */
.slide.active {
  opacity: 1;
}

.slide.active img {
  animation: slowZoomOut 6s linear forwards; /* Durasi animasi tiap foto (6 detik) */
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.2); /* Memulai foto dari kondisi agak besar */
}

/* Animasi menggerakkan skala foto mengecil (Zoom Out) */
@keyframes slowZoomOut {
  from {
    transform: scale(1.2);
  }
  to {
    transform: scale(1.0);
  }
}

/* Kontainer pembungkus titik-titik */
.dot-container {
    position: absolute;
    bottom: 20px; /* Jarak dari bawah foto utama */
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px; /* Jarak antar titik */
    z-index: 10; /* Memastikan titik berada di atas gambar */
}

/* Bentuk dasar titik */
.dot {
    cursor: pointer;
    height: 10px;
    width: 10px;
    background-color: rgba(255, 255, 255, 0.5); /* Putih transparan saat tidak aktif */
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.3s ease, transform 0.3s ease;
}

/* Tampilan titik dan thumbnail saat sedang aktif terpilih */
.dot.active {
    background-color: #ffffff; /* Putih terang benderang */
    transform: scale(1.2);     /* Sedikit lebih besar agar menonjol */
    width: 24px;               /* Membuat bentuk agak lonjong seperti di web contoh */
    border-radius: 5px;
}

/* --- Tambahkan kode dasar thumbnail ini --- */
.thumbnail-row {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    justify-content: center;
    width: 100%; /* Membuat area thumbnail melebar penuh ke bawah */
}

.thumb-img {
    width: 60px;         /* Mengatur lebar gambar kecil */
    height: 60px;        /* Mengatur tinggi gambar kecil */
    object-fit: cover;   /* Agar gambar tidak gepeng */
    border-radius: 8px;  /* Membuat sudut melengkung */
    cursor: pointer;
    opacity: 0.6;        /* Agak pudar saat tidak aktif */
    transition: all 0.3s ease;
}
/* ------------------------------------------ */

/* Kode Anda yang ini tetap ditaruh di bawahnya */
.thumb-img.active {
    border: 2px solid #ff9800;
    opacity: 1;
}

        
.thumb-img.active {
    border: 2px solid #ff9800; /* Memberi garis tepi pada thumbnail aktif */
    opacity: 1;
}

    </style>
    
</head>

<script>
// ==================== 1. LOGIKA SLIDESHOW PRODUK (2 FOTO) ====================
const daftarFoto = ["dimsum1.jpg", "dimsum2.png"]; 
let indeksAktif = 0;
let intervalSlideshow;

function jalankanSlideshowOtomatis() {
    clearInterval(intervalSlideshow); 
    intervalSlideshow = setInterval(function() {
        indeksAktif = (indeksAktif + 1) % daftarFoto.length;
        perbaruiTampilanFoto(indeksAktif);
    }, 3000); 
}

function perbaruiTampilanFoto(indeks) {
    document.getElementById("fotoUtama").src = daftarFoto[indeks];
    const thumbnails = document.getElementsByClassName("thumb-img");
    for (let i = 0; i < thumbnails.length; i++) {
        thumbnails[i].classList.remove("active");
    }
    if(thumbnails[indeks]) {
        thumbnails[indeks].classList.add("active");
    }
}

function gantiFotoManual(indeks) {
    indeksAktif = indeks;
    perbaruiTampilanFoto(indeksAktif);
    jalankanSlideshowOtomatis();
}

// Otomatis jalan saat web dimuat
jalankanSlideshowOtomatis();


// ==================== 2. LOGIKA VALIDASI DAN PENGIRIMAN DATA ====================
function prosesValidasiDanKirim() {
    // Membaca data inputan
    const nama = document.getElementById("nama").value.trim();
    const alamat = document.getElementById("alamat").value.trim();
    const jumlahInput = document.getElementById("jumlah").value;
    const produkSelect = document.getElementById("produk");
    const ongkirSelect = document.getElementById("ongkir");

    // Validasi Manual karena tombol bertipe button biasa
    if (nama === "" || produkSelect.value === "" || jumlahInput === "" || ongkirSelect.value === "" || alamat === "") {
        alert("Mohon lengkapi semua data formulir pemesanan terlebih dahulu!");
        return;
    }

    const jumlah = parseInt(jumlahInput);
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.innerText = "Memproses Order...";
    submitBtn.disabled = true;

    const nomorWA = "6285876712482"; 
    const hargaProduk = parseInt(produkSelect.value);
    const namaProduk = produkSelect.options[produkSelect.selectedIndex].text; 
    const biayaOngkir = parseInt(ongkirSelect.value);
    const namaKurir = ongkirSelect.options[ongkirSelect.selectedIndex].text; 

    const totalHargaAkhir = (hargaProduk * jumlah) + biayaOngkir;

    const formatRupiah = new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
    }).format(totalHargaAkhir);

    // ⚠️ MASUKKAN KEMBALI URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzgpw_zidBdAgnqJmFl980hKzvjjUVCeKT7EFzVKn5UDDxQtX8T6hmeF4gbzWm0pm8v/exec';
    
    const formData = new FormData();
    formData.append('nama', nama);
    formData.append('produk', namaProduk);
    formData.append('jumlah', jumlah + " pcs");
    formData.append('kurir', namaKurir);
    formData.append('alamat', alamat);
    formData.append('total', formatRupiah);

    // Kirim data secara senyap (Fetch API) tanpa reload halaman
    fetch(scriptURL, { method: 'POST', body: formData})
    .then(response => {
        // Tampilkan rangkuman ke Halaman Sukses
        document.getElementById("resNama").innerText = nama;
        document.getElementById("resProduk").innerText = namaProduk;
        document.getElementById("resJumlah").innerText = jumlah + " pcs";
        document.getElementById("resKurir").innerText = namaKurir;
        document.getElementById("resAlamat").innerText = alamat;
        document.getElementById("resTotal").innerText = formatRupiah;

        // Susun teks konfirmasi chat WhatsApp
        const teksPesan = "Halo Admin, saya telah melakukan pemesanan via Web:\n\n" +
                          "*Nama:* " + nama + "\n" +
                          "*Produk:* " + namaProduk + "\n" +
                          "*Jumlah:* " + jumlah + " pcs\n" +
                          "*Pengiriman:* " + namaKurir + "\n" +
                          "*Alamat:* " + alamat + "\n\n" +
                          "*TOTAL BAYAR:* " + formatRupiah;

        // ✔️ SUDAH DIPERBAIKI: Menggunakan alamat lengkap tautan WhatsApp resmi agar tidak error 404
        const urlWhatsApp = "https://wa.me/" + nomorWA + "?text=" + encodeURIComponent(teksPesan);
        document.getElementById("waConfirmBtn").setAttribute("href", urlWhatsApp);

        // Transisi hilangkan form, munculkan nota sukses
        document.getElementById("formSection").style.display = "none";
        document.getElementById("successSection").style.display = "block";
    })
    .catch(error => {
        alert("Terjadi kendala koneksi saat menyimpan order. Silakan coba klik Kirim lagi!");
        submitBtn.innerText = "Kirim Order";
        submitBtn.disabled = false;
        console.error('Error!', error.message);
    });
}

function resetForm() {
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.innerText = "Kirim Order";
    submitBtn.disabled = false;
    document.getElementById("orderForm").reset();
    document.getElementById("successSection").style.display = "none";
    document.getElementById("formSection").style.display = "block";
}

    // Logika JavaScript Terintegrasi

        slides[currentSlide].classList.add('active');
        if(dots[currentSlide]) dots[currentSlide].classList.add('active');
        if(thumbs[currentSlide]) thumbs[currentSlide].classList.add('active');
    }

    // Fungsi ganti otomatis ke slide berikutnya
    function nextSlide() {
        tampilkanSlide(currentSlide + 1);
    }

    // Fungsi jika titik atau thumbnail diklik manual oleh pengunjung
    function gantiFotoManual(n) {
        tampilkanSlide(n);
        resetTimer(); // Reset waktu otomatis agar hitungan detik mengulang dari awal
    }

    // Fungsi menyalakan dan merestart timer otomatis
    function resetTimer() {
        clearInterval(autoSlideTimer);
        autoSlideTimer = setInterval(nextSlide, slideInterval);
    }

    // Jalankan timer saat halaman pertama kali dibuka
    resetTimer();

    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const dotContainer = document.getElementById('dynamic-dots');
    const thumbContainer = document.getElementById('dynamic-thumbs');
    const slideInterval = 5000; // Berganti otomatis setiap 5 detik
    let autoSlideTimer;

    // 1. FUNGSI GENERATE TITIK DAN THUMBNAIL OTOMATIS
    function inisialisasiSlideshow() {
        slides.forEach((slide, index) => {
            // Ambil link gambar dari foto utama untuk dipakai di thumbnail
            const srcGambar = slide.querySelector('img').src;

            // Buat Element Titik (Dot)
            const dot = document.createElement('span');
            dot.className = index === 0 ? 'dot active' : 'dot';
            dot.addEventListener('click', () => gantiFotoManual(index));
            dotContainer.appendChild(dot);

            // Buat Element Thumbnail Gambar
            const thumb = document.createElement('img');
            thumb.src = srcGambar;
            thumb.className = index === 0 ? 'thumb-img active' : 'thumb-img';
            thumb.addEventListener('click', () => gantiFotoManual(index));
            thumbContainer.appendChild(thumb);
        });
    }

    // 2. FUNGSI UNTUK MERUBAH TAMPILAN SLIDE
    function tampilkanSlide(n) {
        const dots = document.querySelectorAll('.dot');
        const thumbs = document.querySelectorAll('.thumb-img');

        // Reset semua status active
        slides.forEach(slide => slide.classList.remove('active'));
        dots.forEach(dot => dot.classList.remove('active'));
        thumbs.forEach(thumb => thumb.classList.remove('active'));

        // Koreksi urutan index angka
        currentSlide = (n + slides.length) % slides.length;

        // Nyalakan elemen yang sedang aktif
        slides[currentSlide].classList.add('active');
        if (dots[currentSlide]) dots[currentSlide].classList.add('active');
        if (thumbs[currentSlide]) thumbs[currentSlide].classList.add('active');
    }

    function nextSlide() {
        tampilkanSlide(currentSlide + 1);
    }

    function gantiFotoManual(n) {
        tampilkanSlide(n);
        resetTimer();
    }

    function resetTimer() {
        clearInterval(autoSlideTimer);
        autoSlideTimer = setInterval(nextSlide, slideInterval);
    }

    // Jalankan pembuatan titik otomatis dan nyalakan timer
    inisialisasiSlideshow();
    resetTimer();
    
          </script>

<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const dotContainer = document.getElementById('dynamic-dots');
    const thumbContainer = document.getElementById('dynamic-thumbs');
    const slideInterval = 5000; // Foto berganti otomatis setiap 5 detik
    let autoSlideTimer;

    // 1. FUNGSI MEMBUAT TITIK & THUMBNAIL OTOMATIS
    function inisialisasiSlideshow() {
        if (!dotContainer || !thumbContainer || slides.length === 0) return;
        
        slides.forEach((slide, index) => {
            const imgElement = slide.querySelector('img');
            if (!imgElement) return;
            const srcGambar = imgElement.src;

            // Buat Element Titik (Dot)
            const dot = document.createElement('span');
            dot.className = index === 0 ? 'dot active' : 'dot';
            dot.addEventListener('click', () => gantiFotoManual(index));
            dotContainer.appendChild(dot);

            // Buat Element Thumbnail Gambar
            const thumb = document.createElement('img');
            thumb.src = srcGambar;
            thumb.className = index === 0 ? 'thumb-img active' : 'thumb-img';
            thumb.addEventListener('click', () => gantiFotoManual(index));
            thumbContainer.appendChild(thumb);
        });
    }

    // 2. FUNGSI MENGATUR PERPINDAHAN FOTO
    function tampilkanSlide(n) {
        const dots = document.querySelectorAll('.dot');
        const thumbs = document.querySelectorAll('.thumb-img');

        slides.forEach(slide => slide.classList.remove('active'));
        dots.forEach(dot => dot.classList.remove('active'));
        thumbs.forEach(thumb => thumb.classList.remove('active'));

        currentSlide = (n + slides.length) % slides.length;

        slides[currentSlide].classList.add('active');
        if (dots[currentSlide]) dots[currentSlide].classList.add('active');
        if (thumbs[currentSlide]) thumbs[currentSlide].classList.add('active');
    }

    function nextSlide() {
        tampilkanSlide(currentSlide + 1);
    }

    function gantiFotoManual(n) {
        tampilkanSlide(n);
        resetTimer();
    }

    function resetTimer() {
        clearInterval(autoSlideTimer);
        autoSlideTimer = setInterval(nextSlide, slideInterval);
    }

    // Jalankan semua fungsi di atas saat web dimuat
    document.addEventListener("DOMContentLoaded", function() {
        inisialisasiSlideshow();
        resetTimer();
    });
</script>

    <script>
    // Membungkus seluruh fungsi agar script HANYA berjalan saat semua HTML selesai dimuat browser
    window.addEventListener('DOMContentLoaded', () => {
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dotContainer = document.getElementById('dynamic-dots');
        const thumbContainer = document.getElementById('dynamic-thumbs');
        const slideInterval = 5000; // Foto berganti otomatis tiap 5 detik
        let autoSlideTimer;

        // Validasi pengaman jika elemen tidak ditemukan di halaman
        if (slides.length === 0 || !dotContainer || !thumbContainer) return;

        // 1. GENERATE TITIK & THUMBNAIL OTOMATIS BERDASARKAN JUMLAH FOTO
        slides.forEach((slide, index) => {
            const imgInside = slide.querySelector('img');
            if (!imgInside) return;
            const srcGambar = imgInside.getAttribute('src');

            // Membuat elemen Titik (Dot)
            const dot = document.createElement('span');
            dot.className = index === 0 ? 'dot active' : 'dot';
            dot.addEventListener('click', () => gantiFotoManual(index));
            dotContainer.appendChild(dot);

            // Membuat elemen Gambar Kecil (Thumbnail)
            const thumb = document.createElement('img');
            thumb.src = srcGambar;
            thumb.className = index === 0 ? 'thumb-img active' : 'thumb-img';
            thumb.addEventListener('click', () => gantiFotoManual(index));
            thumbContainer.appendChild(thumb);
        });

        // 2. LOGIKA UTAMA PERPINDAHAN FOTO
        function tampilkanSlide(n) {
            const dots = document.querySelectorAll('.dot');
            const thumbs = document.querySelectorAll('.thumb-img');

            // Sembunyikan semua elemen aktif terlebih dahulu
            slides.forEach(slide => slide.classList.remove('active'));
            if(dots.length) dots.forEach(dot => dot.classList.remove('active'));
            if(thumbs.length) thumbs.forEach(thumb => thumb.classList.remove('active'));

            // Mengatur putaran urutan indeks agar kembali ke awal jika sudah foto terakhir
            currentSlide = (n + slides.length) % slides.length;

            // Aktifkan elemen foto, titik, dan thumbnail sesuai urutan baru
            slides[currentSlide].classList.add('active');
            if (dots[currentSlide]) dots[currentSlide].classList.add('active');
            if (thumbs[currentSlide]) thumbs[currentSlide].classList.add('active');
        }

        function nextSlide() {
            tampilkanSlide(currentSlide + 1);
        }

        function gantiFotoManual(n) {
            tampilkanSlide(n);
            resetTimer();
        }

        function resetTimer() {
            clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(nextSlide, slideInterval);
        }

        // Mulai jalankan hitungan otomatis pertama kali
        resetTimer();
    });
</script>

</body>
</html>
